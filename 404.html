<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — route not found · rivaldi.dev</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2305060a'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%2322d3ee' font-family='monospace'%3E%E2%9D%AF_%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #05060a;
      color: #c6cadb;
      font-family: "JetBrains Mono", monospace;
      padding: 1.5rem;
    }
    .term {
      width: min(560px, 100%);
      border: 1px solid rgba(231,233,242,0.08);
      border-radius: 18px;
      background: rgba(8,10,18,0.85);
      box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 60px rgba(139,92,246,0.08);
      overflow: hidden;
    }
    .bar { display: flex; gap: 7px; padding: 0.7rem 1rem; border-bottom: 1px solid rgba(231,233,242,0.08); }
    .dot { width: 11px; height: 11px; border-radius: 50%; }
    pre { padding: 1.4rem; font-size: 0.85rem; line-height: 1.9; white-space: pre-wrap; }
    .g { color: #4ade80; } .c { color: #22d3ee; } .m { color: #e879f9; } .d { color: #8b90a5; }
    a { color: #22d3ee; }
    .cursor { animation: b 1s steps(1) infinite; color: #22d3ee; }
    @keyframes b { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <div class="term">
    <div class="bar">
      <span class="dot" style="background:#ff5f57"></span>
      <span class="dot" style="background:#febc2e"></span>
      <span class="dot" style="background:#28c840"></span>
    </div>
    <pre><span class="d">$ resolve <span id="path"></span></span>
<span class="m">error: route not found (404)</span>
<span class="d">the agent searched every block on the chain.
this page does not exist — or was never minted.</span>

<span class="g">suggested fix:</span>
  <span class="c">cd <a href="/">~/home</a></span>

<span class="d">$</span> <span class="cursor">▊</span></pre>
  </div>
  <script>document.getElementById("path").textContent = location.pathname;</script>
</body>
</html>
